<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS Link Tracker</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><h1>GPS Link Tracker</h1><p>Buat tautan untuk meminta seseorang membagikan lokasi GPS secara sadar dan dengan persetujuan.</p><button id="create">Buat link tracking</button><section id="result" hidden><h2>Link berhasil dibuat</h2><label>Link untuk dibagikan melalui WhatsApp</label><input id="shareLink" readonly><button id="copy">Salin link</button><a id="wa" class="button" target="_blank" rel="noopener">Kirim lewat WhatsApp</a><p class="muted">Simpan link dashboard secara pribadi.</p><label>Link dashboard pemantau (rahasia)</label><input id="dashboardLink" readonly><button id="copyDash">Salin link dashboard</button></section><p class="notice">Lokasi hanya dikirim setelah penerima menekan tombol setuju dan mengizinkan akses GPS.</p></main><script>const $=id=>document.getElementById(id);$('create').onclick=async()=>{const r=await fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();const share=location.origin+'/track/'+d.id;const dash=location.origin+'/dashboard/'+d.id+'?key='+d.ownerToken;$('shareLink').value=share;$('dashboardLink').value=dash;$('wa').href='https://wa.me/?text='+encodeURIComponent('Silakan buka link ini jika Anda bersedia membagikan lokasi GPS Anda: '+share);$('result').hidden=false;};$('copy').onclick=() => navigator.clipboard.writeText($('shareLink').value);$('copyDash').onclick=()=>navigator.clipboard.writeText($('dashboardLink').value);</script></body></html>
