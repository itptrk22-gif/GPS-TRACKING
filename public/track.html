<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berbagi Lokasi GPS</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><h1>Permintaan berbagi lokasi</h1><p>Jika Anda setuju, lokasi GPS perangkat ini akan dibagikan kepada pembuat tautan selama halaman ini aktif.</p><p>Anda dapat menghentikannya kapan saja.</p><button id="start">Saya setuju, mulai berbagi lokasi</button><button id="stop" class="secondary" hidden>Berhenti berbagi lokasi</button><p id="status" class="notice">Belum ada lokasi yang dibagikan.</p></main><script src="/socket.io/socket.io.js"></script><script>const id=location.pathname.split('/').pop();const socket=io();let watchId=null;socket.emit('tracker-join',{id});const status=document.getElementById('status');document.getElementById('start').onclick=()=>{if(!navigator.geolocation){status.textContent='Browser tidak mendukung GPS.';return;}status.textContent='Meminta izin lokasi...';watchId=navigator.geolocation.watchPosition(pos=>{socket.emit('location-update',{id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:Date.now()});status.textContent='Lokasi sedang dibagikan. Akurasi sekitar '+Math.round(pos.coords.accuracy)+' meter.';},err=>status.textContent='Lokasi tidak dapat diakses: '+err.message,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});document.getElementById('start').hidden=true;document.getElementById('stop').hidden=false;};function stop(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;socket.emit('tracker-stop',{id});status.textContent='Berbagi lokasi dihentikan.';document.getElementById('stop').hidden=true;document.getElementById('start').hidden=false;}document.getElementById('stop').onclick=stop;window.addEventListener('pagehide',()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);});</script></main></body></html>
