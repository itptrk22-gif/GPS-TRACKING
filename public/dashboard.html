<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard GPS</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><h1>Dashboard lokasi</h1><p id="status" class="notice">Menghubungkan...</p><div id="details" hidden><p>Koordinat: <strong id="coords">-</strong></p><p>Akurasi: <strong id="accuracy">-</strong></p><p>Pembaruan terakhir: <strong id="updated">-</strong></p><a id="map" class="button" target="_blank" rel="noopener">Buka lokasi di Google Maps</a></div><button id="stop" class="secondary">Hentikan sesi tracking</button><p class="muted">Jangan bagikan URL dashboard atau token rahasianya.</p></main><script src="/socket.io/socket.io.js"></script><script>const id=location.pathname.split('/').pop();const key=new URLSearchParams(location.search).get('key');const socket=io();const status=document.getElementById('status');socket.emit('owner-join',{id,ownerToken:key});socket.on('session-status',({active})=>status.textContent=active?'Menunggu persetujuan dan lokasi dari perangkat...':'Sesi tracking dihentikan.');socket.on('location-update',loc=>{document.getElementById('details').hidden=false;document.getElementById('coords').textContent=loc.latitude.toFixed(6)+', '+loc.longitude.toFixed(6);document.getElementById('accuracy').textContent=loc.accuracy==null?'Tidak diketahui':Math.round(loc.accuracy)+' meter';document.getElementById('updated').textContent=new Date(loc.timestamp).toLocaleString('id-ID');document.getElementById('map').href='https://www.google.com/maps?q='+loc.latitude+','+loc.longitude;status.textContent='Lokasi diterima.';});socket.on('tracking-stopped',()=>status.textContent='Sesi tracking dihentikan.');document.getElementById('stop').onclick=async()=>{const r=await fetch('/api/sessions/'+id+'/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ownerToken:key})});status.textContent=r.ok?'Sesi tracking dihentikan.':'Gagal menghentikan sesi.';};</script></main></body></html>
